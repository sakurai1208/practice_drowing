<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="左手稽古帖">
<meta name="color-scheme" content="light dark">
<title>左手 稽古帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  [hidden] { display: none !important; }

  :root{
    --paper:#F0EDE4;
    --paper-deep:#E7E1D2;
    --ink:#2A2724;
    --ink-soft:#5C574F;
    --line-hair:rgba(42,39,36,0.14);
    --shu:#B23B2A;
    --shu-soft:rgba(178,59,42,0.14);
    --ai:#3C5674;
    --moss:#4B6E45;
    --stamp-empty:rgba(42,39,36,0.14);
    --shadow-card:0 1px 2px rgba(42,39,36,0.10), 0 10px 26px rgba(42,39,36,0.08);
    --shadow-sheet:0 -10px 34px rgba(0,0,0,0.24);
    --font-display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
    --font-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#201E1A;
      --paper-deep:#2A2721;
      --ink:#ECE7DC;
      --ink-soft:#B6AFA0;
      --line-hair:rgba(236,231,220,0.16);
      --shu:#E2795F;
      --shu-soft:rgba(226,121,95,0.18);
      --ai:#8FADCF;
      --moss:#8DBB7C;
      --stamp-empty:rgba(236,231,220,0.16);
      --shadow-card:0 1px 2px rgba(0,0,0,0.35), 0 10px 28px rgba(0,0,0,0.38);
      --shadow-sheet:0 -10px 34px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#201E1A; --paper-deep:#2A2721; --ink:#ECE7DC; --ink-soft:#B6AFA0;
    --line-hair:rgba(236,231,220,0.16); --shu:#E2795F; --shu-soft:rgba(226,121,95,0.18);
    --ai:#8FADCF; --moss:#8DBB7C; --stamp-empty:rgba(236,231,220,0.16);
    --shadow-card:0 1px 2px rgba(0,0,0,0.35), 0 10px 28px rgba(0,0,0,0.38);
    --shadow-sheet:0 -10px 34px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    padding:0;
    overscroll-behavior:none;
  }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:20px 18px calc(28px + env(safe-area-inset-bottom));
  }
  .app-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .app-header h1{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:700;
    letter-spacing:.02em;
    margin:0;
  }
  .app-header .sub{
    display:block;
    font-family:var(--font-body);
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:500;
    margin-top:3px;
    letter-spacing:.03em;
  }
  .icon-btn{
    border:none;
    background:var(--paper-deep);
    color:var(--ink-soft);
    width:38px;height:38px;
    border-radius:50%;
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
    touch-action:manipulation;
  }
  .icon-btn:active{ color:var(--ink); }

  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:12px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto;
    padding:9px 15px;
    border:none;
    border-radius:999px;
    background:transparent;
    color:var(--ink-soft);
    font-family:var(--font-body);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    touch-action:manipulation;
    transition:background .15s ease,color .15s ease;
  }
  .tab[aria-selected="true"]{
    background:var(--ink);
    color:var(--paper);
    font-weight:700;
  }

  .sheet{
    background:var(--paper-deep);
    border-radius:18px;
    padding:12px;
    box-shadow:var(--shadow-card);
  }
  .canvas-wrap{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    border-radius:12px;
    overflow:hidden;
    touch-action:none;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .lead-row{
    padding:14px 6px 4px;
    text-align:center;
  }
  .lead-text{
    margin:0;
    font-size:14.5px;
    color:var(--ink-soft);
  }
  .multi-actions{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:10px;
  }

  .result-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 6px 4px;
  }
  .result-row[hidden]{ display:none !important; }
  .stamp{
    width:60px;height:60px;
    border-radius:50%;
    border:2.5px solid currentColor;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:27px;
    font-weight:700;
    transform:rotate(-6deg);
    flex:0 0 auto;
  }
  .stamp.tier-good{ color:var(--moss); }
  .stamp.tier-ok{ color:var(--ai); }
  .stamp.tier-retry{ color:var(--shu); }
  .stamp.pop{ animation:stampPop .38s ease; }
  @keyframes stampPop{
    0%{ transform:rotate(-6deg) scale(2); opacity:0; }
    65%{ transform:rotate(-6deg) scale(0.92); opacity:1; }
    100%{ transform:rotate(-6deg) scale(1); opacity:1; }
  }
  .result-text{ flex:1 1 auto; min-width:0; }
  .score-num{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:700;
    line-height:1;
  }
  .score-num .score-suffix{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    margin-left:2px;
  }
  .score-sub{
    margin-top:5px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .result-actions{
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:0 0 auto;
  }
  .btn{
    padding:9px 16px;
    border-radius:10px;
    border:none;
    font-family:var(--font-body);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    touch-action:manipulation;
    white-space:nowrap;
  }
  .btn-sm{
    padding:6px 14px;
    font-size:12.5px;
    border-radius:8px;
  }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line-hair); }

  .progress-row{
    margin-top:20px;
    padding:0 2px;
  }
  .progress-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:7px;
    font-weight:500;
  }
  .stamps{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
  }
  .stamp-dot{
    width:9px;height:9px;
    border-radius:50%;
    background:var(--stamp-empty);
    flex:0 0 auto;
  }
  .stamp-dot.filled{ background:var(--shu); }

  .stats-row{
    display:flex;
    gap:8px;
    margin-top:16px;
    padding:0 2px;
  }
  .stat-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:6px 13px;
    border-radius:999px;
    background:var(--paper-deep);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .stat-chip strong{
    color:var(--ink);
    font-weight:700;
    font-size:14px;
  }

  .tip{
    margin:22px 2px 0;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.6;
    opacity:.85;
  }

  .overlay{
    position:fixed; inset:0;
    background:rgba(20,18,15,0.4);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .overlay[hidden]{ display:none !important; }
  .settings-panel{
    background:var(--paper);
    width:100%;
    max-width:600px;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow-sheet);
    max-height:84vh;
    overflow-y:auto;
  }
  .settings-panel h2{
    font-family:var(--font-display);
    font-size:17px;
    margin:0 0 16px;
  }
  .settings-block{ margin-bottom:20px; }
  .settings-block-label{
    font-size:13px;
    font-weight:700;
    margin-bottom:9px;
  }
  .settings-block-desc{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:-5px 0 9px;
    line-height:1.5;
  }
  .target-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .target-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper-deep);
    border-radius:10px;
    padding:8px 10px;
    gap:8px;
  }
  .target-item span{ font-size:13px; }
  .target-item input{
    width:52px;
    border:none;
    background:transparent;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    font-weight:700;
    text-align:right;
  }
  .switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper-deep);
    border-radius:10px;
    padding:11px 13px;
  }
  .switch{
    position:relative;
    width:42px;height:24px;
    flex:0 0 auto;
  }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .track{
    position:absolute; inset:0;
    background:var(--line-hair);
    border-radius:999px;
    transition:background .15s ease;
  }
  .switch .thumb{
    position:absolute;
    top:3px; left:3px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--paper);
    transition:transform .15s ease;
  }
  .switch input:checked + .track{ background:var(--shu); }
  .switch input:checked + .track .thumb{ transform:translateX(18px); }

  .seg{
    display:flex;
    background:var(--paper-deep);
    border-radius:10px;
    padding:3px;
    gap:3px;
  }
  .seg button{
    flex:1 1 0;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    padding:8px 6px;
    border-radius:8px;
    font-family:var(--font-body);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .seg button[aria-pressed="true"]{
    background:var(--ink);
    color:var(--paper);
    font-weight:700;
  }
  .danger-btn{
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1.5px solid var(--shu-soft);
    background:transparent;
    color:var(--shu);
    font-family:var(--font-body);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }
  .close-row{ margin-top:6px; }
  .close-btn{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div>
      <h1>左手 稽古帖</h1>
      <span class="sub">ひとり稽古・絵のウォームアップ</span>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="設定を開く">⚙</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="練習の種類">
    <button class="tab" role="tab" data-mode="straight" aria-selected="true">直線</button>
    <button class="tab" role="tab" data-mode="curve" aria-selected="false">曲線</button>
    <button class="tab" role="tab" data-mode="circle" aria-selected="false">円</button>
    <button class="tab" role="tab" data-mode="spiral" aria-selected="false">渦巻</button>
    <button class="tab" role="tab" data-mode="box" aria-selected="false">直方体</button>
    <button class="tab" role="tab" data-mode="cylinder" aria-selected="false">円柱</button>
    <button class="tab" role="tab" data-mode="free" aria-selected="false">素振り</button>
  </nav>

  <section class="sheet">
    <div class="canvas-wrap">
      <canvas id="cv"></canvas>
    </div>
  </section>

  <section class="lead-row" id="leadRow">
    <p class="lead-text" id="leadText">始点から終点まで、まっすぐに引いてみよう</p>
    <div class="multi-actions" id="multiActions" hidden>
      <button class="btn btn-ghost btn-sm" id="undoStrokeBtn">1画戻す</button>
      <button class="btn btn-primary btn-sm" id="submitMultiBtn">採点する</button>
    </div>
  </section>

  <section class="result-row" id="resultRow" hidden aria-live="polite">
    <div class="stamp tier-good" id="stampMark">◎</div>
    <div class="result-text">
      <div class="score-num"><span id="scoreNum">0</span><span class="score-suffix">点</span></div>
      <div class="score-sub">
        <span id="subAccuracy">線のブレ 0</span>
        <span id="subCoverage">なぞれた範囲 0%</span>
      </div>
    </div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="retryBtn">やり直す</button>
      <button class="btn btn-primary" id="nextBtn">次へ</button>
    </div>
  </section>

  <section class="progress-row">
    <div class="progress-label" id="progressLabel">直線 0/50本</div>
    <div class="stamps" id="stampTrack"></div>
  </section>

  <section class="stats-row">
    <div class="stat-chip">今日 <strong id="todayCount">0</strong>本</div>
    <div class="stat-chip">連続 <strong id="streakCount">0</strong>日目</div>
  </section>

  <p class="tip">直方体・円柱は複数本の線で描けます。描き終えて約1.2秒何もしないか「採点する」を押すと判定されます。</p>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="settings-panel">
    <h2>設定</h2>

    <div class="settings-block">
      <div class="settings-block-label">今日の目標本数</div>
      <div class="target-grid">
        <label class="target-item"><span>直線</span><input type="number" id="tg-straight" min="5" max="300" step="5"></label>
        <label class="target-item"><span>曲線</span><input type="number" id="tg-curve" min="5" max="300" step="5"></label>
        <label class="target-item"><span>円</span><input type="number" id="tg-circle" min="5" max="300" step="5"></label>
        <label class="target-item"><span>渦巻</span><input type="number" id="tg-spiral" min="5" max="300" step="5"></label>
        <label class="target-item"><span>直方体</span><input type="number" id="tg-box" min="5" max="300" step="5"></label>
        <label class="target-item"><span>円柱</span><input type="number" id="tg-cylinder" min="5" max="300" step="5"></label>
      </div>
    </div>

    <div class="settings-block">
      <div class="switch-row">
        <div>
          <div class="settings-block-label" style="margin-bottom:2px;">お手本をだんだん薄くする</div>
          <div class="settings-block-desc" style="margin:0;">見て描き写すより、覚えて動かす練習になります</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="fadeToggle">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>
    </div>

    <div class="settings-block">
      <div class="settings-block-label">むずかしさ</div>
      <div class="settings-block-desc">判定の厳しさが変わります。まずは「ふつう」がおすすめです</div>
      <div class="seg" id="difficultySeg">
        <button data-val="easy" aria-pressed="false">やさしい</button>
        <button data-val="normal" aria-pressed="true">ふつう</button>
        <button data-val="hard" aria-pressed="false">むずかしい</button>
      </div>
    </div>

    <div class="settings-block">
      <button class="danger-btn" id="resetTodayBtn">今日の記録をリセット</button>
    </div>

    <div class="close-row">
      <button class="close-btn" id="closeSettingsBtn">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "hidariteKeikochou_v3";
  var settings = {
    targets: { straight:50, curve:40, circle:30, spiral:20, box:20, cylinder:20, free:30 },
    fadeEnabled: false,
    difficulty: "normal"
  };
  var history = {};

  function loadState(){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.settings){
          settings.targets = Object.assign({}, settings.targets, parsed.settings.targets||{});
          settings.fadeEnabled = !!parsed.settings.fadeEnabled;
          settings.difficulty = parsed.settings.difficulty || "normal";
        }
        if(parsed && parsed.history) history = parsed.history;
      }
    }catch(e){}
  }
  function saveState(){
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ settings:settings, history:history }));
    }catch(e){}
  }

  function pad2(n){ return n<10 ? "0"+n : ""+n; }
  function todayKey(){
    var d = new Date();
    return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  }
  function totalFor(key){
    var rec = history[key];
    if(!rec) return 0;
    var sum = 0;
    for(var k in rec){ if(Object.prototype.hasOwnProperty.call(rec,k)) sum += rec[k]; }
    return sum;
  }
  function countFor(key, m){
    var rec = history[key];
    if(!rec) return 0;
    return rec[m] || 0;
  }
  function incrementRep(m){
    var key = todayKey();
    if(!history[key]) history[key] = { straight:0, curve:0, circle:0, spiral:0, box:0, cylinder:0, free:0 };
    history[key][m] = (history[key][m]||0) + 1;
    saveState();
    updateProgressUI();
    updateStatsUI();
  }
  function computeStreak(){
    var key = todayKey();
    var streak = 0;
    var d = new Date();
    if(totalFor(key) > 0){ streak = 1; }
    d.setDate(d.getDate()-1);
    while(true){
      var k = d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
      if(totalFor(k) > 0){ streak++; d.setDate(d.getDate()-1); }
      else break;
      if(streak > 3650) break;
    }
    return streak;
  }

  var canvas = document.getElementById("cv");
  var ctx = canvas.getContext("2d");
  var wrap = canvas.parentElement;
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  var leadText = document.getElementById("leadText");
  var multiActions = document.getElementById("multiActions");
  var undoStrokeBtn = document.getElementById("undoStrokeBtn");
  var submitMultiBtn = document.getElementById("submitMultiBtn");
  var resultRow = document.getElementById("resultRow");
  var stampMark = document.getElementById("stampMark");
  var scoreNum = document.getElementById("scoreNum");
  var subAccuracy = document.getElementById("subAccuracy");
  var subCoverage = document.getElementById("subCoverage");
  var retryBtn = document.getElementById("retryBtn");
  var nextBtn = document.getElementById("nextBtn");
  var progressLabel = document.getElementById("progressLabel");
  var stampTrack = document.getElementById("stampTrack");
  var todayCountEl = document.getElementById("todayCount");
  var streakCountEl = document.getElementById("streakCount");
  var settingsBtn = document.getElementById("settingsBtn");
  var overlay = document.getElementById("overlay");
  var closeSettingsBtn = document.getElementById("closeSettingsBtn");
  var resetTodayBtn = document.getElementById("resetTodayBtn");
  var fadeToggle = document.getElementById("fadeToggle");
  var difficultySeg = document.getElementById("difficultySeg");
  var targetInputs = {
    straight: document.getElementById("tg-straight"),
    curve: document.getElementById("tg-curve"),
    circle: document.getElementById("tg-circle"),
    spiral: document.getElementById("tg-spiral"),
    box: document.getElementById("tg-box"),
    cylinder: document.getElementById("tg-cylinder")
  };

  var MODE_LABEL = {
    straight:"直線", curve:"曲線", circle:"円", spiral:"渦巻",
    box:"直方体", cylinder:"円柱", free:"素振り"
  };
  var LEAD_TEXT = {
    straight:"始点から終点まで、まっすぐに引いてみよう",
    curve:"腕全体を大きく使って、流れるような曲線を引こう",
    circle:"手首を固めず、肩とひじで一筆で丸く",
    spiral:"中心から等間隔を意識して、外側へ広げよう",
    box:"アタリの基本。面の向きとパースの収束を意識して形をとろう",
    cylinder:"上下の楕円の丸みの変化と、側面のパースを意識しよう",
    free:"ガイドなし。画面いっぱいに腕を振って脱力しよう"
  };

  var mode = "straight";
  var W = 0, H = 0, dpr = 1;
  var guide = null;
  var guideOpacity = 1;
  var fadeRAF = null;
  var isDrawing = false;
  var currentPoints = [];
  var accumulatedStrokes = [];
  var scoredStrokes = null;
  var lastFreeStroke = null;
  var renderQueued = false;
  var multiStrokeTimer = null;

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function fitPointsInBounds(pts, margin, keyPoints){
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for(var i=0; i<pts.length; i++){
      if(pts[i].x < minX) minX = pts[i].x;
      if(pts[i].x > maxX) maxX = pts[i].x;
      if(pts[i].y < minY) minY = pts[i].y;
      if(pts[i].y > maxY) maxY = pts[i].y;
    }
    var curW = maxX - minX || 1;
    var curH = maxY - minY || 1;
    var targetW = W - margin * 2;
    var targetH = H - margin * 2;
    var scale = Math.min(targetW / curW, targetH / curH);

    var curCx = (minX + maxX) / 2;
    var curCy = (minY + maxY) / 2;
    var targetCx = W / 2;
    var targetCy = H / 2;

    for(var j=0; j<pts.length; j++){
      pts[j].x = targetCx + (pts[j].x - curCx) * scale;
      pts[j].y = targetCy + (pts[j].y - curCy) * scale;
    }
    if(keyPoints){
      for(var k=0; k<keyPoints.length; k++){
        keyPoints[k].x = targetCx + (keyPoints[k].x - curCx) * scale;
        keyPoints[k].y = targetCy + (keyPoints[k].y - curCy) * scale;
      }
    }
  }

  function sampleSegment(p1, p2, count){
    var pts = [];
    for(var i=0; i<=count; i++){
      var t = i / count;
      pts.push({ x: p1.x + (p2.x - p1.x)*t, y: p1.y + (p2.y - p1.y)*t });
    }
    return pts;
  }

  // ---------- 3D Perspective Projection Engine ----------
  function rotatePoint(p, pitch, yaw, roll){
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var x1 = p.x * cy + p.z * sy;
    var y1 = p.y;
    var z1 = -p.x * sy + p.z * cy;

    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var x2 = x1;
    var y2 = y1 * cp - z1 * sp;
    var z2 = y1 * sp + z1 * cp;

    var cr = Math.cos(roll), sr = Math.sin(roll);
    var x3 = x2 * cr - y2 * sr;
    var y3 = x2 * sr + y2 * cr;
    var z3 = z2;
    return { x: x3, y: y3, z: z3 };
  }

  function projectPoint(p, camDist, fovScale){
    var zDist = camDist - p.z;
    if(zDist < 1) zDist = 1;
    var s = fovScale / zDist;
    return { x: p.x * s, y: -p.y * s, z: p.z };
  }

  // ---------- Generators ----------
  function genStraight(){
    var margin = Math.min(W,H)*0.16;
    var angle = Math.random()*Math.PI;
    var len = Math.min(W,H)*(0.65 + Math.random()*0.22);
    var cx = W/2, cy = H/2;
    var dx = Math.cos(angle)*len/2, dy = Math.sin(angle)*len/2;
    var p1 = { x: cx-dx, y: cy-dy };
    var p2 = { x: cx+dx, y: cy+dy };
    var pts = sampleSegment(p1, p2, 220);
    fitPointsInBounds(pts, margin);
    return { points: pts, paths: [pts] };
  }

  function genCurve(){
    var margin = Math.min(W,H)*0.14;
    var len = Math.min(W,H)*(0.85 + Math.random()*0.25);
    var angle = Math.random()*Math.PI*2;
    var isSCurve = Math.random() < 0.45;

    var cx = W/2, cy = H/2;
    var dx = Math.cos(angle)*(len/2), dy = Math.sin(angle)*(len/2);
    var x1 = cx - dx, y1 = cy - dy;
    var x2 = cx + dx, y2 = cy + dy;
    var nx = -Math.sin(angle), ny = Math.cos(angle);

    var N = 240, pts = [];
    if(!isSCurve){
      var bend = len * (0.28 + Math.random()*0.22) * (Math.random()<0.5 ? 1 : -1);
      var cpX = cx + nx * bend;
      var cpY = cy + ny * bend;
      for(var i=0; i<=N; i++){
        var t=i/N, mt=1-t;
        pts.push({
          x: mt*mt*x1 + 2*mt*t*cpX + t*t*x2,
          y: mt*mt*y1 + 2*mt*t*cpY + t*t*y2
        });
      }
    } else {
      var side = Math.random()<0.5 ? 1 : -1;
      var bend1 = len * (0.24 + Math.random()*0.18) * side;
      var bend2 = -len * (0.24 + Math.random()*0.18) * side;
      var cp1X = x1 + (x2-x1)*0.32 + nx*bend1;
      var cp1Y = y1 + (y2-y1)*0.32 + ny*bend1;
      var cp2X = x1 + (x2-x1)*0.68 + nx*bend2;
      var cp2Y = y1 + (y2-y1)*0.68 + ny*bend2;
      for(var j=0; j<=N; j++){
        var s=j/N, ms=1-s;
        pts.push({
          x: ms*ms*ms*x1 + 3*ms*ms*s*cp1X + 3*ms*s*s*cp2X + s*s*s*x2,
          y: ms*ms*ms*y1 + 3*ms*ms*s*cp1Y + 3*ms*s*s*cp2Y + s*s*s*y2
        });
      }
    }
    fitPointsInBounds(pts, margin);
    return { points: pts, paths: [pts] };
  }

  function genCircle(){
    var margin = Math.min(W,H)*0.18;
    var r = Math.min(W,H)*0.34;
    var cx = W/2, cy = H/2;
    var N=240, pts=[];
    var start = -Math.PI/2;
    for(var i=0; i<=N; i++){
      var t=i/N, a=start + t*Math.PI*2;
      pts.push({ x: cx+Math.cos(a)*r, y: cy+Math.sin(a)*r });
    }
    fitPointsInBounds(pts, margin);
    return { points: pts, paths: [pts] };
  }

  function genSpiral(){
    var margin = Math.min(W,H)*0.15;
    var maxR = Math.min(W,H)*0.40;
    var turns = 2.4;
    var cx = W/2, cy = H/2;
    var N=260, pts=[];
    for(var i=0; i<=N; i++){
      var t=i/N;
      var a = t*turns*Math.PI*2 - Math.PI/2;
      var rr = maxR*0.10 + (maxR-maxR*0.10)*t;
      pts.push({ x: cx+Math.cos(a)*rr, y: cy+Math.sin(a)*rr });
    }
    fitPointsInBounds(pts, margin);
    return { points: pts, paths: [pts] };
  }

  function genBox(){
    var margin = Math.min(W,H)*0.16;
    var camDist = 320, fovScale = 320;
    var bW = 120 + Math.random()*40;
    var bH = 120 + Math.random()*50;
    var bD = 120 + Math.random()*40;
    var isBirdEye = Math.random() < 0.75;
    var pitch = isBirdEye ? (0.30 + Math.random()*0.20) : -(0.28 + Math.random()*0.16);
    var yawSign = Math.random() < 0.5 ? 1 : -1;
    var yaw = yawSign * (0.55 + Math.random()*0.35);
    var roll = (Math.random() - 0.5) * 0.08;

    var hw = bW/2, hh = bH/2, hd = bD/2;
    var vLocal = [
      {x:-hw, y:-hh, z:-hd},
      {x: hw, y:-hh, z:-hd},
      {x: hw, y: hh, z:-hd},
      {x:-hw, y: hh, z:-hd},
      {x:-hw, y:-hh, z: hd},
      {x: hw, y:-hh, z: hd},
      {x: hw, y: hh, z: hd},
      {x:-hw, y: hh, z: hd}
    ];

    var faces = [
      { v:[3,2,6,7], n:{x:0, y:1, z:0}, c:{x:0, y:hh, z:0} },
      { v:[0,4,5,1], n:{x:0, y:-1, z:0}, c:{x:0, y:-hh, z:0} },
      { v:[4,5,6,7], n:{x:0, y:0, z:1}, c:{x:0, y:0, z:hd} },
      { v:[1,0,3,2], n:{x:0, y:0, z:-1}, c:{x:0, y:0, z:-hd} },
      { v:[5,1,2,6], n:{x:1, y:0, z:0}, c:{x:hw, y:0, z:0} },
      { v:[0,4,7,3], n:{x:-1, y:0, z:0}, c:{x:-hw, y:0, z:0} }
    ];

    var edgeMap = {};
    for(var f=0; f<faces.length; f++){
      var fc = faces[f];
      var rc = rotatePoint(fc.c, pitch, yaw, roll);
      var rn = rotatePoint(fc.n, pitch, yaw, roll);
      var vCam = { x: -rc.x, y: -rc.y, z: camDist - rc.z };
      var dot = rn.x*vCam.x + rn.y*vCam.y + rn.z*vCam.z;
      if(dot > 0){
        for(var e=0; e<4; e++){
          var u = fc.v[e];
          var v = fc.v[(e+1)%4];
          var key = Math.min(u,v) + "_" + Math.max(u,v);
          edgeMap[key] = [u, v];
        }
      }
    }

    var v2d = new Array(8);
    for(var vi=0; vi<8; vi++){
      var rotV = rotatePoint(vLocal[vi], pitch, yaw, roll);
      v2d[vi] = projectPoint(rotV, camDist, fovScale);
    }

    var paths = [];
    var allPts = [];
    var keyPointsMap = {};

    var edgeKeys = Object.keys(edgeMap);
    for(var k=0; k<edgeKeys.length; k++){
      var pair = edgeMap[edgeKeys[k]];
      var pA = v2d[pair[0]], pB = v2d[pair[1]];
      keyPointsMap[pair[0]] = pA;
      keyPointsMap[pair[1]] = pB;
      var seg = sampleSegment(pA, pB, 26);
      paths.push(seg);
      for(var s=0; s<seg.length; s++) allPts.push(seg[s]);
    }

    var keyPoints = [];
    var kpKeys = Object.keys(keyPointsMap);
    for(var ki=0; ki<kpKeys.length; ki++){
      keyPoints.push(keyPointsMap[kpKeys[ki]]);
    }

    fitPointsInBounds(allPts, margin, keyPoints);
    return { points: allPts, paths: paths, keyPoints: keyPoints };
  }

  function genCylinder(){
    var margin = Math.min(W,H)*0.16;
    var camDist = 320, fovScale = 320;
    var R = 60 + Math.random()*20;
    var cylH = 130 + Math.random()*50;
    var isBirdEye = Math.random() < 0.75;
    var pitch = isBirdEye ? (0.32 + Math.random()*0.20) : -(0.30 + Math.random()*0.16);
    var yaw = (Math.random() - 0.5) * 0.4;
    var roll = (Math.random() - 0.5) * 0.08;

    var topC = rotatePoint({x:0, y:cylH/2, z:0}, pitch, yaw, roll);
    var topN = rotatePoint({x:0, y:1, z:0}, pitch, yaw, roll);
    var vTop = { x: -topC.x, y: -topC.y, z: camDist - topC.z };
    var dotTop = topN.x*vTop.x + topN.y*vTop.y + topN.z*vTop.z;

    var N = 120;
    var ptsTop3D = new Array(N);
    var ptsBot3D = new Array(N);
    var visibleSide = new Array(N);

    for(var i=0; i<N; i++){
      var a = i * (Math.PI*2 / N);
      var cosA = Math.cos(a), sinA = Math.sin(a);
      var pT = rotatePoint({x: R*cosA, y: cylH/2, z: R*sinA}, pitch, yaw, roll);
      var pB = rotatePoint({x: R*cosA, y: -cylH/2, z: R*sinA}, pitch, yaw, roll);
      var pM = rotatePoint({x: R*cosA, y: 0, z: R*sinA}, pitch, yaw, roll);
      var norm = rotatePoint({x: cosA, y: 0, z: sinA}, pitch, yaw, roll);

      var vCam = { x: -pM.x, y: -pM.y, z: camDist - pM.z };
      var dSide = norm.x*vCam.x + norm.y*vCam.y + norm.z*vCam.z;

      ptsTop3D[i] = pT;
      ptsBot3D[i] = pB;
      visibleSide[i] = dSide > 0;
    }

    var i1 = -1, i2 = -1;
    for(var j=0; j<N; j++){
      var prev = (j - 1 + N) % N;
      var next = (j + 1) % N;
      if(!visibleSide[prev] && visibleSide[j]) i1 = j;
      if(visibleSide[j] && !visibleSide[next]) i2 = j;
    }
    if(i1 === -1 || i2 === -1){
      i1 = Math.round(N * 0.25);
      i2 = Math.round(N * 0.75);
    }

    var p2dTop = new Array(N);
    var p2dBot = new Array(N);
    for(var k=0; k<N; k++){
      p2dTop[k] = projectPoint(ptsTop3D[k], camDist, fovScale);
      p2dBot[k] = projectPoint(ptsBot3D[k], camDist, fovScale);
    }

    var paths = [];
    var allPts = [];

    // 全周が見える底面
    var fullLoop = [];
    var fullPts2D = (dotTop > 0) ? p2dTop : p2dBot;
    for(var f=0; f<=N; f++){
      fullLoop.push({ x: fullPts2D[f % N].x, y: fullPts2D[f % N].y });
    }
    paths.push(fullLoop);

    // 手前側（半周）が見える底面の弧
    var arcLoop = [];
    var arcPts2D = (dotTop > 0) ? p2dBot : p2dTop;
    var idx = i1;
    while(true){
      arcLoop.push({ x: arcPts2D[idx].x, y: arcPts2D[idx].y });
      if(idx === i2) break;
      idx = (idx + 1) % N;
    }
    paths.push(arcLoop);

    // 側面の輪郭線（母線）2本（交差せず確実に上底と下底の同一点を結ぶ）
    var side1 = sampleSegment(p2dTop[i1], p2dBot[i1], 28);
    var side2 = sampleSegment(p2dTop[i2], p2dBot[i2], 28);
    paths.push(side1);
    paths.push(side2);

    for(var p=0; p<paths.length; p++){
      for(var q=0; q<paths[p].length; q++){
        allPts.push(paths[p][q]);
      }
    }

    fitPointsInBounds(allPts, margin);
    return { points: allPts, paths: paths };
  }

  var GENERATORS = {
    straight: genStraight,
    curve: genCurve,
    circle: genCircle,
    spiral: genSpiral,
    box: genBox,
    cylinder: genCylinder
  };

  function isMultiMode(){
    return mode === "box" || mode === "cylinder";
  }

  function getThresholdFactors(){
    var table = {
      easy:   { covF:0.075, kF:0.085 },
      normal: { covF:0.050, kF:0.055 },
      hard:   { covF:0.032, kF:0.035 }
    };
    return table[settings.difficulty] || table.normal;
  }

  function handleScoreStrokes(strokesArray){
    if(!guide || !guide.points || guide.points.length === 0) return;
    var guidePts = guide.points;
    var allUserPts = [];
    var i, s;

    for(s=0; s<strokesArray.length; s++){
      for(i=0; i<strokesArray[s].length; i++){
        allUserPts.push(strokesArray[s][i]);
      }
    }
    if(allUserPts.length < 2) return;

    var sumDev = 0;
    var scored = [];
    var f = getThresholdFactors();
    var k = Math.min(W,H)*f.kF;
    var goodTh = k*0.6;
    var midTh = k*1.45;

    for(s=0; s<strokesArray.length; s++){
      var strk = strokesArray[s];
      var devs = new Array(strk.length);
      for(i=0; i<strk.length; i++){
        var minD = Infinity;
        for(var j=0; j<guidePts.length; j++){
          var dx = strk[i].x - guidePts[j].x;
          var dy = strk[i].y - guidePts[j].y;
          var d = dx*dx + dy*dy;
          if(d < minD) minD = d;
        }
        var dist = Math.sqrt(minD);
        devs[i] = dist;
        sumDev += dist;
      }
      scored.push({ points: strk, devs: devs, goodThresh: goodTh, midThresh: midTh });
    }

    var avgDev = sumDev / allUserPts.length;
    var covThresh = Math.min(W,H)*f.covF;
    var covered = 0;

    for(var g=0; g<guidePts.length; g++){
      var minGD = Infinity;
      for(var u=0; u<allUserPts.length; u++){
        var gdx = guidePts[g].x - allUserPts[u].x;
        var gdy = guidePts[g].y - allUserPts[u].y;
        var gd = gdx*gdx + gdy*gdy;
        if(gd < minGD) minGD = gd;
      }
      if(Math.sqrt(minGD) < covThresh) covered++;
    }

    var coverageRatio = covered / guidePts.length;
    var accuracyScore = Math.round(100 * Math.exp(-avgDev / k));
    var coverageScore = Math.round(coverageRatio * 100);
    var overall = Math.round(accuracyScore*0.65 + coverageScore*0.35);

    scoredStrokes = scored;
    accumulatedStrokes = [];
    multiActions.hidden = true;
    incrementRep(mode);
    showResult(overall, accuracyScore, coverageScore);
    requestRender();
  }

  function handleFreeStrokeComplete(points){
    var len = 0;
    for(var i=1; i<points.length; i++){
      len += Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
    }
    if(len < 18) return;
    lastFreeStroke = points;
    incrementRep("free");
    requestRender();
  }

  function showResult(overall, accuracyScore, coverageScore){
    resultRow.hidden = false;
    resultRow.style.display = "flex";
    scoreNum.textContent = overall;
    subAccuracy.textContent = "線のブレ " + accuracyScore;
    subCoverage.textContent = "なぞれた範囲 " + coverageScore + "%";

    stampMark.classList.remove("tier-good","tier-ok","tier-retry","pop");
    var mark, tier;
    if(overall >= 90){ mark="◎"; tier="tier-good"; }
    else if(overall >= 65){ mark="○"; tier="tier-ok"; }
    else { mark="△"; tier="tier-retry"; }
    stampMark.textContent = mark;
    stampMark.classList.add(tier);
    void stampMark.offsetWidth;
    stampMark.classList.add("pop");
  }

  function hideResult(){
    resultRow.hidden = true;
    resultRow.style.display = "none";
  }

  function drawGridBackground(theme){
    var step = 26;
    ctx.fillStyle = theme.lineHair;
    for(var gx=step/2; gx<W; gx+=step){
      for(var gy=step/2; gy<H; gy+=step){
        ctx.beginPath();
        ctx.arc(gx,gy,1.1,0,Math.PI*2);
        ctx.fill();
      }
    }
  }

  function drawGuide(g, opacity, theme){
    if(!g) return;
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = theme.shu;
    ctx.lineCap = "round"; ctx.lineJoin = "round";

    var paths = g.paths || (g.points ? [g.points] : []);
    for(var p=0; p<paths.length; p++){
      var pts = paths[p];
      if(!pts || pts.length < 2) continue;
      ctx.setLineDash([7,7]);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(var i=1; i<pts.length; i++){
        ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);

    ctx.globalAlpha = Math.min(1, opacity + 0.3);
    ctx.fillStyle = theme.shu;
    if(g.keyPoints){
      for(var k=0; k<g.keyPoints.length; k++){
        ctx.beginPath();
        ctx.arc(g.keyPoints[k].x, g.keyPoints[k].y, 4.5, 0, Math.PI*2);
        ctx.fill();
      }
    } else if(paths.length === 1 && paths[0].length > 0){
      ctx.beginPath();
      ctx.arc(paths[0][0].x, paths[0][0].y, 5.5, 0, Math.PI*2);
      ctx.fill();

      if(mode === "straight" || mode === "curve"){
        var last = paths[0][paths[0].length - 1];
        ctx.beginPath();
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = theme.shu;
        ctx.arc(last.x, last.y, 7, 0, Math.PI*2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawPlainStroke(points, theme){
    ctx.save();
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.strokeStyle = theme.ink;
    for(var i=1; i<points.length; i++){
      var pr = points[i].p !== undefined ? points[i].p : 0.5;
      ctx.lineWidth = 1.8 + pr*3.0;
      ctx.beginPath();
      ctx.moveTo(points[i-1].x, points[i-1].y);
      ctx.lineTo(points[i].x, points[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function colorForDev(dev, s, theme){
    if(dev < s.goodThresh) return theme.moss;
    if(dev < s.midThresh) return theme.ai;
    return theme.shu;
  }

  function drawScoredStrokeItem(s, theme){
    ctx.save();
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.lineWidth = 3.4;
    for(var i=1; i<s.points.length; i++){
      ctx.strokeStyle = colorForDev(s.devs[i], s, theme);
      ctx.beginPath();
      ctx.moveTo(s.points[i-1].x, s.points[i-1].y);
      ctx.lineTo(s.points[i].x, s.points[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function render(){
    if(W<=0 || H<=0) return;
    var theme = {
      ink: cssVar("--ink") || "#2A2724",
      shu: cssVar("--shu") || "#B23B2A",
      ai: cssVar("--ai") || "#3C5674",
      moss: cssVar("--moss") || "#4B6E45",
      paperDeep: cssVar("--paper-deep") || "#E7E1D2",
      lineHair: cssVar("--line-hair") || "rgba(42,39,36,0.14)"
    };
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = theme.paperDeep;
    ctx.fillRect(0,0,W,H);
    drawGridBackground(theme);

    if(mode !== "free"){
      if(guide) drawGuide(guide, guideOpacity, theme);
      if(scoredStrokes){
        for(var s=0; s<scoredStrokes.length; s++){
          drawScoredStrokeItem(scoredStrokes[s], theme);
        }
      } else if(accumulatedStrokes.length > 0){
        for(var a=0; a<accumulatedStrokes.length; a++){
          drawPlainStroke(accumulatedStrokes[a], theme);
        }
      }
    } else {
      if(lastFreeStroke) drawPlainStroke(lastFreeStroke, theme);
    }

    if(isDrawing && currentPoints.length>1) drawPlainStroke(currentPoints, theme);
  }

  function requestRender(){
    if(renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(function(){ renderQueued=false; render(); });
  }

  function resetGuideVisibility(){
    guideOpacity = 1;
    if(fadeRAF){ cancelAnimationFrame(fadeRAF); fadeRAF=null; }
    if(!settings.fadeEnabled || mode==="free"){ requestRender(); return; }
    var holdMs=1100, fadeMs=1400, minOpacity=0.14;
    var t0 = performance.now();
    function step(now){
      var elapsed = now-t0;
      if(elapsed < holdMs){ guideOpacity = 1; }
      else if(elapsed < holdMs+fadeMs){
        var p = (elapsed-holdMs)/fadeMs;
        guideOpacity = 1-(1-minOpacity)*p;
      } else {
        guideOpacity = minOpacity;
        requestRender();
        fadeRAF = null;
        return;
      }
      requestRender();
      fadeRAF = requestAnimationFrame(step);
    }
    fadeRAF = requestAnimationFrame(step);
  }

  function clearMultiTimer(){
    if(multiStrokeTimer){ clearTimeout(multiStrokeTimer); multiStrokeTimer=null; }
  }

  function newGuide(){
    clearMultiTimer();
    scoredStrokes = null;
    accumulatedStrokes = [];
    multiActions.hidden = true;

    if(mode !== "free" && GENERATORS[mode] && W > 0 && H > 0){
      guide = GENERATORS[mode]();
    } else {
      guide = null;
    }
    hideResult();
    resetGuideVisibility();
  }

  function resizeCanvas(){
    var rect = wrap.getBoundingClientRect();
    if(rect.width === 0 || rect.height === 0) return;
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W*dpr);
    canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function handleResize(){
    if(isDrawing){ isDrawing=false; currentPoints=[]; }
    resizeCanvas();
    newGuide();
  }

  function pointFromEvent(e){
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX-rect.left, y: e.clientY-rect.top, p: e.pressure>0 ? e.pressure : 0.5 };
  }

  canvas.addEventListener("pointerdown", function(e){
    if(mode!=="free" && !guide) return;
    clearMultiTimer();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    isDrawing = true;
    if(!isMultiMode()){
      scoredStrokes = null;
      accumulatedStrokes = [];
    } else if(scoredStrokes){
      scoredStrokes = null;
      accumulatedStrokes = [];
    }
    hideResult();
    currentPoints = [pointFromEvent(e)];
    requestRender();
    e.preventDefault();
  }, { passive:false });

  canvas.addEventListener("pointermove", function(e){
    if(!isDrawing) return;
    currentPoints.push(pointFromEvent(e));
    requestRender();
    e.preventDefault();
  }, { passive:false });

  function finishPointer(e){
    if(!isDrawing) return;
    isDrawing = false;
    try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
    var pts = currentPoints;
    currentPoints = [];
    if(pts.length < 2){ requestRender(); return; }

    if(mode === "free"){
      handleFreeStrokeComplete(pts);
    } else if(!isMultiMode()){
      handleScoreStrokes([pts]);
    } else {
      accumulatedStrokes.push(pts);
      multiActions.hidden = false;
      requestRender();
      clearMultiTimer();
      multiStrokeTimer = setTimeout(function(){
        if(accumulatedStrokes.length > 0 && !scoredStrokes){
          handleScoreStrokes(accumulatedStrokes);
        }
      }, 1250);
    }
  }
  window.addEventListener("pointerup", finishPointer);
  window.addEventListener("pointercancel", finishPointer);

  undoStrokeBtn.addEventListener("click", function(){
    clearMultiTimer();
    if(accumulatedStrokes.length > 0){
      accumulatedStrokes.pop();
      if(accumulatedStrokes.length === 0) multiActions.hidden = true;
      requestRender();
    }
  });

  submitMultiBtn.addEventListener("click", function(){
    clearMultiTimer();
    if(accumulatedStrokes.length > 0){
      handleScoreStrokes(accumulatedStrokes);
    }
  });

  function switchMode(m){
    mode = m;
    tabs.forEach(function(t){ t.setAttribute("aria-selected", t.dataset.mode===m ? "true":"false"); });
    leadText.textContent = LEAD_TEXT[m];
    lastFreeStroke = null;
    newGuide();
    updateProgressUI();
  }
  tabs.forEach(function(t){
    t.addEventListener("click", function(){ switchMode(t.dataset.mode); });
  });

  retryBtn.addEventListener("click", function(){
    scoredStrokes = null;
    accumulatedStrokes = [];
    multiActions.hidden = true;
    hideResult();
    resetGuideVisibility();
  });
  nextBtn.addEventListener("click", function(){
    newGuide();
  });

  function updateProgressUI(){
    var label = MODE_LABEL[mode];
    var target = settings.targets[mode] || 0;
    var count = countFor(todayKey(), mode);
    progressLabel.textContent = label + " " + count + "/" + target + "本";
    var dotsShown = Math.max(1, Math.min(target, 40));
    stampTrack.innerHTML = "";
    var filledDots = target>0 ? Math.round(Math.min(count,target)/target*dotsShown) : 0;
    for(var i=0; i<dotsShown; i++){
      var d = document.createElement("span");
      d.className = "stamp-dot" + (i<filledDots ? " filled" : "");
      stampTrack.appendChild(d);
    }
  }

  function updateStatsUI(){
    todayCountEl.textContent = totalFor(todayKey());
    streakCountEl.textContent = computeStreak();
  }

  function openSettings(){
    targetInputs.straight.value = settings.targets.straight;
    targetInputs.curve.value = settings.targets.curve;
    targetInputs.circle.value = settings.targets.circle;
    targetInputs.spiral.value = settings.targets.spiral;
    targetInputs.box.value = settings.targets.box;
    targetInputs.cylinder.value = settings.targets.cylinder;
    fadeToggle.checked = settings.fadeEnabled;
    Array.prototype.slice.call(difficultySeg.querySelectorAll("button")).forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.val===settings.difficulty ? "true":"false");
    });
    overlay.hidden = false;
    overlay.style.display = "flex";
  }
  function closeSettings(){
    overlay.hidden = true;
    overlay.style.display = "none";
  }
  settingsBtn.addEventListener("click", openSettings);
  closeSettingsBtn.addEventListener("click", closeSettings);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeSettings(); });

  Object.keys(targetInputs).forEach(function(k){
    if(!targetInputs[k]) return;
    targetInputs[k].addEventListener("change", function(){
      var v = parseInt(targetInputs[k].value, 10);
      if(isNaN(v) || v<1) v = settings.targets[k];
      v = Math.max(1, Math.min(999, v));
      settings.targets[k] = v;
      saveState();
      updateProgressUI();
    });
  });
  fadeToggle.addEventListener("change", function(){
    settings.fadeEnabled = fadeToggle.checked;
    saveState();
    resetGuideVisibility();
  });
  difficultySeg.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn) return;
    settings.difficulty = btn.dataset.val;
    Array.prototype.slice.call(difficultySeg.querySelectorAll("button")).forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.val===settings.difficulty ? "true":"false");
    });
    saveState();
  });
  resetTodayBtn.addEventListener("click", function(){
    if(!window.confirm("今日の記録をリセットします。よろしいですか？")) return;
    delete history[todayKey()];
    saveState();
    updateProgressUI();
    updateStatsUI();
  });

  function boot(){
    loadState();
    updateStatsUI();
    resizeCanvas();
    newGuide();
    updateProgressUI();
    closeSettings();
    hideResult();

    var ro = new ResizeObserver(function(){ handleResize(); });
    ro.observe(wrap);
    window.addEventListener("orientationchange", function(){ setTimeout(handleResize, 300); });
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
