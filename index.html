<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- <head> 内に追加 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="左手稽古帖">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>左手 稽古帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F0EDE4;
    --paper-deep:#E7E1D2;
    --ink:#2A2724;
    --ink-soft:#5C574F;
    --line-hair:rgba(42,39,36,0.14);
    --shu:#B23B2A;
    --shu-soft:rgba(178,59,42,0.14);
    --ai:#3C5674;
    --moss:#4B6E45;
    --stamp-empty:rgba(42,39,36,0.14);
    --shadow-card:0 1px 2px rgba(42,39,36,0.10), 0 10px 26px rgba(42,39,36,0.08);
    --shadow-sheet:0 -10px 34px rgba(0,0,0,0.24);
    --font-display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
    --font-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#201E1A;
      --paper-deep:#2A2721;
      --ink:#ECE7DC;
      --ink-soft:#B6AFA0;
      --line-hair:rgba(236,231,220,0.16);
      --shu:#E2795F;
      --shu-soft:rgba(226,121,95,0.18);
      --ai:#8FADCF;
      --moss:#8DBB7C;
      --stamp-empty:rgba(236,231,220,0.16);
      --shadow-card:0 1px 2px rgba(0,0,0,0.35), 0 10px 28px rgba(0,0,0,0.38);
      --shadow-sheet:0 -10px 34px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#201E1A; --paper-deep:#2A2721; --ink:#ECE7DC; --ink-soft:#B6AFA0;
    --line-hair:rgba(236,231,220,0.16); --shu:#E2795F; --shu-soft:rgba(226,121,95,0.18);
    --ai:#8FADCF; --moss:#8DBB7C; --stamp-empty:rgba(236,231,220,0.16);
    --shadow-card:0 1px 2px rgba(0,0,0,0.35), 0 10px 28px rgba(0,0,0,0.38);
    --shadow-sheet:0 -10px 34px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:20px 18px calc(28px + env(safe-area-inset-bottom));
  }
  .app-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .app-header h1{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:700;
    letter-spacing:.02em;
    margin:0;
  }
  .app-header .sub{
    display:block;
    font-family:var(--font-body);
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:500;
    margin-top:3px;
    letter-spacing:.03em;
  }
  .icon-btn{
    border:none;
    background:var(--paper-deep);
    color:var(--ink-soft);
    width:38px;height:38px;
    border-radius:50%;
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
    touch-action:manipulation;
  }
  .icon-btn:active{ color:var(--ink); }

  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    margin-bottom:12px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto;
    padding:9px 15px;
    border:none;
    border-radius:999px;
    background:transparent;
    color:var(--ink-soft);
    font-family:var(--font-body);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    touch-action:manipulation;
    transition:background .15s ease,color .15s ease;
  }
  .tab[aria-selected="true"]{
    background:var(--ink);
    color:var(--paper);
    font-weight:700;
  }

  .sheet{
    background:var(--paper-deep);
    border-radius:18px;
    padding:12px;
    box-shadow:var(--shadow-card);
  }
  .canvas-wrap{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    border-radius:12px;
    overflow:hidden;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
  }
  .lead-row{
    padding:14px 6px 4px;
    text-align:center;
  }
  .lead-text{
    margin:0;
    font-size:14.5px;
    color:var(--ink-soft);
  }

  .result-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 6px 4px;
  }
  .stamp{
    width:60px;height:60px;
    border-radius:50%;
    border:2.5px solid currentColor;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:27px;
    font-weight:700;
    transform:rotate(-6deg);
    flex:0 0 auto;
  }
  .stamp.tier-good{ color:var(--moss); }
  .stamp.tier-ok{ color:var(--ai); }
  .stamp.tier-retry{ color:var(--shu); }
  .stamp.pop{ animation:stampPop .38s ease; }
  @keyframes stampPop{
    0%{ transform:rotate(-6deg) scale(2); opacity:0; }
    65%{ transform:rotate(-6deg) scale(0.92); opacity:1; }
    100%{ transform:rotate(-6deg) scale(1); opacity:1; }
  }
  .result-text{ flex:1 1 auto; min-width:0; }
  .score-num{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:700;
    line-height:1;
  }
  .score-num .score-suffix{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    margin-left:2px;
  }
  .score-sub{
    margin-top:5px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .result-actions{
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:0 0 auto;
  }
  .btn{
    padding:9px 16px;
    border-radius:10px;
    border:none;
    font-family:var(--font-body);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    touch-action:manipulation;
    white-space:nowrap;
  }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line-hair); }

  .progress-row{
    margin-top:20px;
    padding:0 2px;
  }
  .progress-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:7px;
    font-weight:500;
  }
  .stamps{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
  }
  .stamp-dot{
    width:9px;height:9px;
    border-radius:50%;
    background:var(--stamp-empty);
    flex:0 0 auto;
  }
  .stamp-dot.filled{ background:var(--shu); }

  .stats-row{
    display:flex;
    gap:8px;
    margin-top:16px;
    padding:0 2px;
  }
  .stat-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:6px 13px;
    border-radius:999px;
    background:var(--paper-deep);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .stat-chip strong{
    color:var(--ink);
    font-weight:700;
    font-size:14px;
  }

  .tip{
    margin:22px 2px 0;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.6;
    opacity:.85;
  }

  .overlay{
    position:fixed; inset:0;
    background:rgba(20,18,15,0.4);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .settings-panel{
    background:var(--paper);
    width:100%;
    max-width:600px;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow-sheet);
    max-height:84vh;
    overflow-y:auto;
  }
  .settings-panel h2{
    font-family:var(--font-display);
    font-size:17px;
    margin:0 0 16px;
  }
  .settings-block{ margin-bottom:20px; }
  .settings-block-label{
    font-size:13px;
    font-weight:700;
    margin-bottom:9px;
  }
  .settings-block-desc{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:-5px 0 9px;
    line-height:1.5;
  }
  .target-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .target-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper-deep);
    border-radius:10px;
    padding:8px 10px;
    gap:8px;
  }
  .target-item span{ font-size:13px; }
  .target-item input{
    width:52px;
    border:none;
    background:transparent;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    font-weight:700;
    text-align:right;
  }
  .switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper-deep);
    border-radius:10px;
    padding:11px 13px;
  }
  .switch{
    position:relative;
    width:42px;height:24px;
    flex:0 0 auto;
  }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .track{
    position:absolute; inset:0;
    background:var(--line-hair);
    border-radius:999px;
    transition:background .15s ease;
  }
  .switch .thumb{
    position:absolute;
    top:3px; left:3px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--paper);
    transition:transform .15s ease;
  }
  .switch input:checked + .track{ background:var(--shu); }
  .switch input:checked + .track .thumb{ transform:translateX(18px); }

  .seg{
    display:flex;
    background:var(--paper-deep);
    border-radius:10px;
    padding:3px;
    gap:3px;
  }
  .seg button{
    flex:1 1 0;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    padding:8px 6px;
    border-radius:8px;
    font-family:var(--font-body);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .seg button[aria-pressed="true"]{
    background:var(--ink);
    color:var(--paper);
    font-weight:700;
  }
  .danger-btn{
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1.5px solid var(--shu-soft);
    background:transparent;
    color:var(--shu);
    font-family:var(--font-body);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }
  .close-row{ margin-top:6px; }
  .close-btn{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div>
      <h1>左手 稽古帖</h1>
      <span class="sub">ひとり稽古・iPad向け</span>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="設定を開く">⚙</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="練習の種類">
    <button class="tab" role="tab" data-mode="straight" aria-selected="true">直線</button>
    <button class="tab" role="tab" data-mode="curve" aria-selected="false">曲線</button>
    <button class="tab" role="tab" data-mode="circle" aria-selected="false">円</button>
    <button class="tab" role="tab" data-mode="spiral" aria-selected="false">渦巻</button>
    <button class="tab" role="tab" data-mode="free" aria-selected="false">素振り</button>
  </nav>

  <section class="sheet">
    <div class="canvas-wrap">
      <canvas id="cv"></canvas>
    </div>
  </section>

  <section class="lead-row" id="leadRow">
    <p class="lead-text" id="leadText">始点から終点まで、まっすぐに引いてみよう</p>
  </section>

  <section class="result-row" id="resultRow" hidden aria-live="polite">
    <div class="stamp tier-good" id="stampMark">◎</div>
    <div class="result-text">
      <div class="score-num"><span id="scoreNum">0</span><span class="score-suffix">点</span></div>
      <div class="score-sub">
        <span id="subAccuracy">線のブレ 0</span>
        <span id="subCoverage">なぞれた範囲 0%</span>
      </div>
    </div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="retryBtn">やり直す</button>
      <button class="btn btn-primary" id="nextBtn">次へ</button>
    </div>
  </section>

  <section class="progress-row">
    <div class="progress-label" id="progressLabel">直線 0/50本</div>
    <div class="stamps" id="stampTrack"></div>
  </section>

  <section class="stats-row">
    <div class="stat-chip">今日 <strong id="todayCount">0</strong>本</div>
    <div class="stat-chip">連続 <strong id="streakCount">0</strong>日目</div>
  </section>

  <p class="tip">Safariの共有ボタンから「ホーム画面に追加」しておくと、アプリのように開けます。線は朱色のお手本に近いほど緑、離れるほど赤に色分けされます。</p>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="settings-panel">
    <h2>設定</h2>

    <div class="settings-block">
      <div class="settings-block-label">今日の目標本数</div>
      <div class="target-grid">
        <label class="target-item"><span>直線</span><input type="number" id="tg-straight" min="5" max="300" step="5"></label>
        <label class="target-item"><span>曲線</span><input type="number" id="tg-curve" min="5" max="300" step="5"></label>
        <label class="target-item"><span>円</span><input type="number" id="tg-circle" min="5" max="300" step="5"></label>
        <label class="target-item"><span>渦巻</span><input type="number" id="tg-spiral" min="5" max="300" step="5"></label>
      </div>
    </div>

    <div class="settings-block">
      <div class="switch-row">
        <div>
          <div class="settings-block-label" style="margin-bottom:2px;">お手本をだんだん薄くする</div>
          <div class="settings-block-desc" style="margin:0;">見て描き写すより、覚えて動かす練習になります</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="fadeToggle">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>
    </div>

    <div class="settings-block">
      <div class="settings-block-label">むずかしさ</div>
      <div class="settings-block-desc">判定の厳しさが変わります。まずは「ふつう」がおすすめです</div>
      <div class="seg" id="difficultySeg">
        <button data-val="easy" aria-pressed="false">やさしい</button>
        <button data-val="normal" aria-pressed="true">ふつう</button>
        <button data-val="hard" aria-pressed="false">むずかしい</button>
      </div>
    </div>

    <div class="settings-block">
      <button class="danger-btn" id="resetTodayBtn">今日の記録をリセット</button>
    </div>

    <div class="close-row">
      <button class="close-btn" id="closeSettingsBtn">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- persistence ----------
  var STORAGE_KEY = "hidariteKeikochou_v1";
  var settings = { targets:{ straight:50, curve:40, circle:30, spiral:20, free:30 }, fadeEnabled:false, difficulty:"normal" };
  var history = {}; // "YYYY-MM-DD" -> { straight:n, curve:n, circle:n, spiral:n, free:n }

  function loadState(){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.settings){
          settings.targets = Object.assign({}, settings.targets, parsed.settings.targets||{});
          settings.fadeEnabled = !!parsed.settings.fadeEnabled;
          settings.difficulty = parsed.settings.difficulty || "normal";
        }
        if(parsed && parsed.history) history = parsed.history;
      }
    }catch(e){ /* 保存領域が使えない場合はメモリ上だけで動かす */ }
  }
  function saveState(){
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ settings:settings, history:history }));
    }catch(e){ /* 保存に失敗しても練習は続けられるようにする */ }
  }

  function pad2(n){ return n<10 ? "0"+n : ""+n; }
  function todayKey(){
    var d = new Date();
    return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  }
  function totalFor(key){
    var rec = history[key];
    if(!rec) return 0;
    var sum = 0;
    for(var k in rec){ if(Object.prototype.hasOwnProperty.call(rec,k)) sum += rec[k]; }
    return sum;
  }
  function countFor(key, m){
    var rec = history[key];
    if(!rec) return 0;
    return rec[m] || 0;
  }
  function incrementRep(m){
    var key = todayKey();
    if(!history[key]) history[key] = { straight:0, curve:0, circle:0, spiral:0, free:0 };
    history[key][m] = (history[key][m]||0) + 1;
    saveState();
    updateProgressUI();
    updateStatsUI();
  }
  function computeStreak(){
    var key = todayKey();
    var streak = 0;
    var d = new Date();
    if(totalFor(key) > 0){ streak = 1; }
    d.setDate(d.getDate()-1);
    while(true){
      var k = d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
      if(totalFor(k) > 0){ streak++; d.setDate(d.getDate()-1); }
      else break;
      if(streak > 3650) break; // safety valve
    }
    return streak;
  }

  // ---------- DOM refs ----------
  var canvas = document.getElementById("cv");
  var ctx = canvas.getContext("2d");
  var wrap = canvas.parentElement;
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  var leadText = document.getElementById("leadText");
  var resultRow = document.getElementById("resultRow");
  var stampMark = document.getElementById("stampMark");
  var scoreNum = document.getElementById("scoreNum");
  var subAccuracy = document.getElementById("subAccuracy");
  var subCoverage = document.getElementById("subCoverage");
  var retryBtn = document.getElementById("retryBtn");
  var nextBtn = document.getElementById("nextBtn");
  var progressLabel = document.getElementById("progressLabel");
  var stampTrack = document.getElementById("stampTrack");
  var todayCountEl = document.getElementById("todayCount");
  var streakCountEl = document.getElementById("streakCount");
  var settingsBtn = document.getElementById("settingsBtn");
  var overlay = document.getElementById("overlay");
  var closeSettingsBtn = document.getElementById("closeSettingsBtn");
  var resetTodayBtn = document.getElementById("resetTodayBtn");
  var fadeToggle = document.getElementById("fadeToggle");
  var difficultySeg = document.getElementById("difficultySeg");
  var targetInputs = {
    straight: document.getElementById("tg-straight"),
    curve: document.getElementById("tg-curve"),
    circle: document.getElementById("tg-circle"),
    spiral: document.getElementById("tg-spiral")
  };

  var MODE_LABEL = { straight:"直線", curve:"曲線", circle:"円", spiral:"渦巻", free:"素振り" };
  var LEAD_TEXT = {
    straight:"始点から終点まで、まっすぐに引いてみよう",
    curve:"ゆるやかな曲線を、なめらかになぞろう",
    circle:"一筆で、ぐるっと丸く",
    spiral:"内側から外側へ、渦を巻くように",
    free:"ガイドなし。肩とひじから大きく動かしてほぐそう"
  };

  // ---------- canvas state ----------
  var mode = "straight";
  var W = 0, H = 0, dpr = 1;
  var guide = null;
  var guideOpacity = 1;
  var fadeRAF = null;
  var isDrawing = false;
  var currentPoints = [];
  var scoredStroke = null;
  var lastFreeStroke = null;
  var renderQueued = false;

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

  function clampSegment(x1,y1,x2,y2,margin){
    var cx=(x1+x2)/2, cy=(y1+y2)/2;
    for(var i=0;i<40;i++){
      var ok = x1>=margin && x1<=W-margin && y1>=margin && y1<=H-margin &&
               x2>=margin && x2<=W-margin && y2>=margin && y2<=H-margin;
      if(ok) break;
      x1 = cx+(x1-cx)*0.92; y1 = cy+(y1-cy)*0.92;
      x2 = cx+(x2-cx)*0.92; y2 = cy+(y2-cy)*0.92;
    }
    return [x1,y1,x2,y2];
  }

  // ---------- guide generators (fresh pixel-space points each call) ----------
  function genStraight(){
    var margin = Math.min(W,H)*0.15;
    var angle = Math.random()*Math.PI;
    var len = Math.min(W,H)*(0.55+Math.random()*0.28);
    var cx = W/2 + (Math.random()-0.5)*W*0.10;
    var cy = H/2 + (Math.random()-0.5)*H*0.10;
    var dx = Math.cos(angle)*len/2, dy = Math.sin(angle)*len/2;
    var seg = clampSegment(cx-dx, cy-dy, cx+dx, cy+dy, margin);
    var x1=seg[0], y1=seg[1], x2=seg[2], y2=seg[3];
    var N=220, pts=[];
    for(var i=0;i<=N;i++){
      var t=i/N;
      pts.push({ x: x1+(x2-x1)*t, y: y1+(y2-y1)*t });
    }
    return { points: pts };
  }

  function genCurve(){
    var margin = Math.min(W,H)*0.16;
    var x1 = margin + Math.random()*(W-2*margin);
    var y1 = margin + Math.random()*(H-2*margin);
    var angle = Math.random()*Math.PI*2;
    var len = Math.min(W,H)*(0.5+Math.random()*0.28);
    var x2r = x1+Math.cos(angle)*len, y2r = y1+Math.sin(angle)*len;
    var seg = clampSegment(x1,y1,x2r,y2r,margin);
    x1=seg[0]; y1=seg[1]; var x2=seg[2], y2=seg[3];
    var mx=(x1+x2)/2, my=(y1+y2)/2;
    var nx=-(y2-y1), ny=(x2-x1);
    var nlen = Math.hypot(nx,ny) || 1;
    var actualLen = Math.hypot(x2-x1,y2-y1);
    var bend = (0.18+Math.random()*0.24)*actualLen*(Math.random()<0.5?-1:1);
    var cxp = clamp(mx+(nx/nlen)*bend, margin, W-margin);
    var cyp = clamp(my+(ny/nlen)*bend, margin, H-margin);
    var N=220, pts=[];
    for(var i=0;i<=N;i++){
      var t=i/N, mt=1-t;
      var x = mt*mt*x1 + 2*mt*t*cxp + t*t*x2;
      var y = mt*mt*y1 + 2*mt*t*cyp + t*t*y2;
      pts.push({x:x,y:y});
    }
    return { points: pts };
  }

  function genCircle(){
    var margin = Math.min(W,H)*0.17;
    var maxR = Math.min(W,H)/2 - margin;
    var minR = maxR*0.42;
    var r = minR + Math.random()*(maxR-minR);
    var cx = clamp(W/2+(Math.random()-0.5)*W*0.08, r+margin*0.3, W-r-margin*0.3);
    var cy = clamp(H/2+(Math.random()-0.5)*H*0.08, r+margin*0.3, H-r-margin*0.3);
    var N=240, pts=[];
    var start=-Math.PI/2;
    for(var i=0;i<=N;i++){
      var t=i/N, a=start+t*Math.PI*2;
      pts.push({ x: cx+Math.cos(a)*r, y: cy+Math.sin(a)*r });
    }
    return { points: pts };
  }

  function genSpiral(){
    var margin = Math.min(W,H)*0.15;
    var maxR = Math.min(W,H)/2 - margin;
    var turns = 2 + Math.random()*1.1;
    var cx = W/2, cy = H/2;
    var N=260, pts=[];
    for(var i=0;i<=N;i++){
      var t=i/N;
      var a = t*turns*Math.PI*2 - Math.PI/2;
      var rr = maxR*0.10 + (maxR-maxR*0.10)*t;
      pts.push({ x: cx+Math.cos(a)*rr, y: cy+Math.sin(a)*rr });
    }
    return { points: pts };
  }

  var GENERATORS = { straight: genStraight, curve: genCurve, circle: genCircle, spiral: genSpiral };

  // ---------- scoring ----------
  function getThresholdFactors(){
    var table = {
      easy:   { covF:0.065, kF:0.075 },
      normal: { covF:0.045, kF:0.050 },
      hard:   { covF:0.030, kF:0.032 }
    };
    return table[settings.difficulty] || table.normal;
  }

  function handleScoredStrokeComplete(points){
    var guidePts = guide.points;
    var i, j, dx, dy, d, minD;
    var sumDev = 0;
    var devs = new Array(points.length);

    for(i=0;i<points.length;i++){
      minD = Infinity;
      for(j=0;j<guidePts.length;j++){
        dx = points[i].x-guidePts[j].x; dy = points[i].y-guidePts[j].y;
        d = dx*dx+dy*dy;
        if(d<minD) minD=d;
      }
      minD = Math.sqrt(minD);
      devs[i] = minD;
      sumDev += minD;
    }
    var avgDev = sumDev/points.length;

    var f = getThresholdFactors();
    var covThresh = Math.min(W,H)*f.covF;
    var covered = 0;
    for(j=0;j<guidePts.length;j++){
      minD = Infinity;
      for(i=0;i<points.length;i++){
        dx = points[i].x-guidePts[j].x; dy = points[i].y-guidePts[j].y;
        d = dx*dx+dy*dy;
        if(d<minD) minD=d;
      }
      if(Math.sqrt(minD) < covThresh) covered++;
    }
    var coverageRatio = covered/guidePts.length;

    var k = Math.min(W,H)*f.kF;
    var accuracyScore = Math.round(100*Math.exp(-avgDev/k));
    var coverageScore = Math.round(coverageRatio*100);
    var overall = Math.round(accuracyScore*0.65 + coverageScore*0.35);

    scoredStroke = { points: points, devs: devs, goodThresh: k*0.55, midThresh: k*1.4 };
    incrementRep(mode);
    showResult(overall, accuracyScore, coverageScore);
    requestRender();
  }

  function handleFreeStrokeComplete(points){
    var len = 0;
    for(var i=1;i<points.length;i++){
      len += Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    }
    if(len < 18) return;
    lastFreeStroke = points;
    incrementRep("free");
    requestRender();
  }

  // ---------- result UI ----------
  function showResult(overall, accuracyScore, coverageScore){
    resultRow.hidden = false;
    scoreNum.textContent = overall;
    subAccuracy.textContent = "線のブレ " + accuracyScore;
    subCoverage.textContent = "なぞれた範囲 " + coverageScore + "%";

    stampMark.classList.remove("tier-good","tier-ok","tier-retry","pop");
    var mark, tier;
    if(overall >= 90){ mark="◎"; tier="tier-good"; }
    else if(overall >= 65){ mark="○"; tier="tier-ok"; }
    else { mark="△"; tier="tier-retry"; }
    stampMark.textContent = mark;
    stampMark.classList.add(tier);
    // restart animation
    void stampMark.offsetWidth;
    stampMark.classList.add("pop");
  }
  function hideResult(){
    resultRow.hidden = true;
  }

  // ---------- rendering ----------
  function drawGridBackground(theme){
    var step = 26;
    ctx.fillStyle = theme.lineHair;
    for(var gx=step/2; gx<W; gx+=step){
      for(var gy=step/2; gy<H; gy+=step){
        ctx.beginPath();
        ctx.arc(gx,gy,1.1,0,Math.PI*2);
        ctx.fill();
      }
    }
  }

  function drawGuide(g, opacity, theme){
    if(!g) return;
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.setLineDash([7,7]);
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = theme.shu;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    for(var i=0;i<g.points.length;i++){
      var p = g.points[i];
      if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.globalAlpha = Math.min(1, opacity+0.3);
    ctx.fillStyle = theme.shu;
    ctx.beginPath();
    ctx.arc(g.points[0].x, g.points[0].y, 5.5, 0, Math.PI*2);
    ctx.fill();

    if(mode==="straight" || mode==="curve"){
      var last = g.points[g.points.length-1];
      ctx.beginPath();
      ctx.lineWidth = 2.4;
      ctx.strokeStyle = theme.shu;
      ctx.arc(last.x, last.y, 7, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlainStroke(points, theme){
    ctx.save();
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.strokeStyle = theme.ink;
    for(var i=1;i<points.length;i++){
      var pr = points[i].p!==undefined ? points[i].p : 0.5;
      ctx.lineWidth = 1.8 + pr*3.0;
      ctx.beginPath();
      ctx.moveTo(points[i-1].x, points[i-1].y);
      ctx.lineTo(points[i].x, points[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function colorForDev(dev, s, theme){
    if(dev < s.goodThresh) return theme.moss;
    if(dev < s.midThresh) return theme.ai;
    return theme.shu;
  }

  function drawScoredStroke(s, theme){
    ctx.save();
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.lineWidth = 3.4;
    for(var i=1;i<s.points.length;i++){
      ctx.strokeStyle = colorForDev(s.devs[i], s, theme);
      ctx.beginPath();
      ctx.moveTo(s.points[i-1].x, s.points[i-1].y);
      ctx.lineTo(s.points[i].x, s.points[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function render(){
    var theme = {
      ink: cssVar("--ink"), shu: cssVar("--shu"), ai: cssVar("--ai"),
      moss: cssVar("--moss"), paperDeep: cssVar("--paper-deep"), lineHair: cssVar("--line-hair")
    };
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = theme.paperDeep;
    ctx.fillRect(0,0,W,H);
    drawGridBackground(theme);

    if(mode !== "free"){
      if(guide) drawGuide(guide, guideOpacity, theme);
      if(scoredStroke) drawScoredStroke(scoredStroke, theme);
    } else {
      if(lastFreeStroke) drawPlainStroke(lastFreeStroke, theme);
    }
    if(isDrawing && currentPoints.length>1) drawPlainStroke(currentPoints, theme);
  }

  function requestRender(){
    if(renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(function(){ renderQueued=false; render(); });
  }

  function resetGuideVisibility(){
    guideOpacity = 1;
    if(fadeRAF){ cancelAnimationFrame(fadeRAF); fadeRAF=null; }
    if(!settings.fadeEnabled || mode==="free"){ requestRender(); return; }
    var holdMs=1100, fadeMs=1400, minOpacity=0.14;
    var t0 = performance.now();
    function step(now){
      var elapsed = now-t0;
      if(elapsed < holdMs){ guideOpacity = 1; }
      else if(elapsed < holdMs+fadeMs){
        var p = (elapsed-holdMs)/fadeMs;
        guideOpacity = 1-(1-minOpacity)*p;
      } else {
        guideOpacity = minOpacity;
        requestRender();
        fadeRAF = null;
        return;
      }
      requestRender();
      fadeRAF = requestAnimationFrame(step);
    }
    fadeRAF = requestAnimationFrame(step);
  }

  function newGuide(){
    scoredStroke = null;
    if(mode !== "free" && GENERATORS[mode]){
      guide = GENERATORS[mode]();
    } else {
      guide = null;
    }
    hideResult();
    resetGuideVisibility();
  }

  // ---------- sizing ----------
  function resizeCanvas(){
    var rect = wrap.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W*dpr);
    canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function handleResize(){
    if(isDrawing){ isDrawing=false; currentPoints=[]; }
    resizeCanvas();
    newGuide();
  }

  // ---------- pointer handling ----------
  function pointFromEvent(e){
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX-rect.left, y: e.clientY-rect.top, p: e.pressure>0 ? e.pressure : 0.5 };
  }
  canvas.addEventListener("pointerdown", function(e){
    if(mode!=="free" && !guide) return;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    isDrawing = true;
    scoredStroke = null;
    hideResult();
    currentPoints = [pointFromEvent(e)];
    requestRender();
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", function(e){
    if(!isDrawing) return;
    currentPoints.push(pointFromEvent(e));
    requestRender();
    e.preventDefault();
  });
  function finishPointer(e){
    if(!isDrawing) return;
    isDrawing = false;
    var pts = currentPoints;
    currentPoints = [];
    if(pts.length < 2){ requestRender(); return; }
    if(mode==="free") handleFreeStrokeComplete(pts);
    else handleScoredStrokeComplete(pts);
  }
  window.addEventListener("pointerup", finishPointer);
  window.addEventListener("pointercancel", finishPointer);

  // ---------- UI wiring ----------
  function switchMode(m){
    mode = m;
    tabs.forEach(function(t){ t.setAttribute("aria-selected", t.dataset.mode===m ? "true":"false"); });
    leadText.textContent = LEAD_TEXT[m];
    lastFreeStroke = null;
    newGuide();
    updateProgressUI();
  }
  tabs.forEach(function(t){
    t.addEventListener("click", function(){ switchMode(t.dataset.mode); });
  });
  retryBtn.addEventListener("click", function(){
    scoredStroke = null;
    hideResult();
    resetGuideVisibility();
  });
  nextBtn.addEventListener("click", function(){
    newGuide();
  });

  function updateProgressUI(){
    var label = MODE_LABEL[mode];
    var target = settings.targets[mode] || 0;
    var count = countFor(todayKey(), mode);
    progressLabel.textContent = label + " " + count + "/" + target + "本";
    var dotsShown = Math.max(1, Math.min(target, 40));
    stampTrack.innerHTML = "";
    var filledDots = target>0 ? Math.round(Math.min(count,target)/target*dotsShown) : 0;
    for(var i=0;i<dotsShown;i++){
      var d = document.createElement("span");
      d.className = "stamp-dot" + (i<filledDots ? " filled" : "");
      stampTrack.appendChild(d);
    }
  }
  function updateStatsUI(){
    todayCountEl.textContent = totalFor(todayKey());
    streakCountEl.textContent = computeStreak();
  }

  // ---------- settings panel ----------
  function openSettings(){
    targetInputs.straight.value = settings.targets.straight;
    targetInputs.curve.value = settings.targets.curve;
    targetInputs.circle.value = settings.targets.circle;
    targetInputs.spiral.value = settings.targets.spiral;
    fadeToggle.checked = settings.fadeEnabled;
    Array.prototype.slice.call(difficultySeg.querySelectorAll("button")).forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.val===settings.difficulty ? "true":"false");
    });
    overlay.hidden = false;
  }
  function closeSettings(){ overlay.hidden = true; }
  settingsBtn.addEventListener("click", openSettings);
  closeSettingsBtn.addEventListener("click", closeSettings);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeSettings(); });

  Object.keys(targetInputs).forEach(function(k){
    targetInputs[k].addEventListener("change", function(){
      var v = parseInt(targetInputs[k].value, 10);
      if(isNaN(v) || v<1) v = settings.targets[k];
      v = clamp(v,1,999);
      settings.targets[k] = v;
      saveState();
      updateProgressUI();
    });
  });
  fadeToggle.addEventListener("change", function(){
    settings.fadeEnabled = fadeToggle.checked;
    saveState();
    resetGuideVisibility();
  });
  difficultySeg.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn) return;
    settings.difficulty = btn.dataset.val;
    Array.prototype.slice.call(difficultySeg.querySelectorAll("button")).forEach(function(b){
      b.setAttribute("aria-pressed", b===btn ? "true":"false");
    });
    saveState();
  });
  resetTodayBtn.addEventListener("click", function(){
    if(!window.confirm("今日の記録をリセットします。よろしいですか？")) return;
    delete history[todayKey()];
    saveState();
    updateProgressUI();
    updateStatsUI();
  });

  // ---------- boot ----------
  loadState();
  updateStatsUI();

  var ro = new ResizeObserver(function(){ handleResize(); });
  ro.observe(wrap);
  window.addEventListener("orientationchange", function(){ setTimeout(handleResize, 300); });

  updateProgressUI();
})();
</script>
</body>
</html>
